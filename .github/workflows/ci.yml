name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend/src/Makables.Api.slnx

      - name: Build
        run: dotnet build backend/src/Makables.Api.slnx --no-restore --configuration Release

      - name: Test (unit + integration)
        run: dotnet test backend/src/Makables.Api.slnx --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/src/**/TestResults/*.trx

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src

      - name: Test (vitest a11y + SEO)
        # T-0133 / ADR 0023 §5+§6: jest-axe component tests assert zero
        # WCAG 2.1 AA violations on the critical customer paths + the SEO
        # predicate tests. A11y or predicate regressions fail CI from here.
        run: npm run test:run

      - name: Build
        run: npx next build

  api-parity:
    name: NSwag spec parity (ADR 0022)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Build backend (Release)
        working-directory: backend/src
        run: dotnet build Makables.Api.slnx --configuration Release

      - name: Start backend hosts in background
        working-directory: backend/src
        env:
          # Placeholder values to satisfy every Options class wired with
          # .ValidateOnStart() (T-0027 Jwt, T-0028 SendGrid + PublicAppUrls,
          # T-0029 OutboxDispatcher + OutboxQueues, T-0065 Comgate). The
          # hosts never touch any of these at startup — they only need to
          # pass the boot-time validators so /openapi/v1.json becomes
          # reachable.
          ConnectionStrings__Postgres: 'Host=placeholder;Database=ignored'
          Jwt__Issuer: 'https://makables.test'
          Jwt__SigningKeyBase64: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          SendGrid__ApiKey: 'SG.ci-spec-parity-stub'
          SendGrid__DefaultFromAddress: 'no-reply@makables.test'
          PublicAppUrls__WebBaseUrl: 'https://makables.test'
          OutboxQueues__ConnectionString: 'UseDevelopmentStorage=true'
          OutboxQueues__SendEmailQueueName: 'send-email'
          OutboxDispatcher__HandoffParkMinutes: '15'
          Mapbox__AccessToken: 'pk.ci-spec-parity-stub'
          Ares__BaseUrl: 'https://ares.ci-spec-parity.local'
          # T-0042: AddMakablesBlobStorage.ValidateOnStart requires either
          # ConnectionString or ServiceUri. The spec-parity host never
          # touches blob storage at startup — supply the dev-storage stub
          # so the validator passes and /openapi/v1.json becomes reachable.
          BlobStorage__ConnectionString: 'UseDevelopmentStorage=true'
          # T-0065: ComgateOptions.ValidateOnStart requires MerchantId +
          # Secret non-empty and BaseUrl absolute HTTPS. The spec-parity
          # host never calls Comgate at startup; stub values pass the
          # validator. BaseUrl falls back to the production default if
          # absent (ComgateOptions.BaseUrl initialiser), but setting it
          # here keeps every ValidateOnStart input explicit and the
          # boot diagnostics easy to read.
          Comgate__MerchantId: 'ci-spec-parity-stub-merchant'
          Comgate__Secret: 'ci-spec-parity-stub-secret'
          Comgate__BaseUrl: 'https://payments.comgate.cz'
          # T-0070: Packeta carrier stub values for spec-parity host boot.
          # Validator requires ApiKey + PublicWidgetKey non-empty and BaseUrl
          # / WidgetScriptUrl absolute. Hosts don't call Packeta on startup.
          Packeta__ApiKey: 'ci-spec-parity-stub-packeta-api-key'
          Packeta__PublicWidgetKey: 'ci-spec-parity-stub-packeta-public-widget-key'
          Packeta__BaseUrl: 'https://api.packeta.com'
          Packeta__SenderLabel: 'makables-cz'
          Packeta__WidgetScriptUrl: 'https://widget.packeta.com/v6/www/js/library.js'
          ASPNETCORE_ENVIRONMENT: Production
        run: |
          mkdir -p /tmp/host-logs
          dotnet run --project Makables.Web.Customer --configuration Release --no-build --urls http://localhost:5001 > /tmp/host-logs/customer.log 2>&1 &
          dotnet run --project Makables.Web.Maker    --configuration Release --no-build --urls http://localhost:5002 > /tmp/host-logs/maker.log    2>&1 &
          dotnet run --project Makables.Web.Admin    --configuration Release --no-build --urls http://localhost:5003 > /tmp/host-logs/admin.log    2>&1 &
          dotnet run --project Makables.Web.Public   --configuration Release --no-build --urls http://localhost:5104 > /tmp/host-logs/public.log   2>&1 &
          # Wait for the OpenAPI documents to be reachable. EF Core's connection
          # is lazy, so a placeholder Postgres connection string is enough for
          # hosts to serve /openapi/v1.json (no DB query happens at startup).
          for port in 5001 5002 5003 5104; do
            ready=0
            for i in {1..60}; do
              if curl -sf http://localhost:$port/openapi/v1.json -o /dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              echo "::error::Host on port $port did not serve /openapi/v1.json within 60 s."
              echo "--- host log for port $port ---"
              case $port in
                5001) cat /tmp/host-logs/customer.log ;;
                5002) cat /tmp/host-logs/maker.log    ;;
                5003) cat /tmp/host-logs/admin.log    ;;
                5104) cat /tmp/host-logs/public.log   ;;
              esac
              exit 1
            fi
          done

      - name: Upload host logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: host-startup-logs
          path: /tmp/host-logs/

      - name: Check API parity
        run: npm run check:api

  bicep:
    name: Bicep lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # az ships bicep; `bicep build` compiles main.bicep to ARM JSON and runs
      # the linter. Catches type/reference/param errors in the IaC before a
      # deploy ever runs them. (This was a gap: the templates were never
      # validated in CI.)
      - name: Install Bicep CLI
        run: az bicep install
      - name: Build (lint) main.bicep
        run: az bicep build --file infra/bicep/main.bicep --stdout > /dev/null
      - name: Validate .bicepparam files compile
        run: |
          az bicep build-params --file infra/bicep/envs/weu.dev.bicepparam --stdout > /dev/null
          az bicep build-params --file infra/bicep/envs/weu.prod.bicepparam --stdout > /dev/null
        env:
          # build-params evaluates readEnvironmentVariable(); supply stub values
          # so compilation succeeds (these are NOT real secrets — CI lint only).
          # Provider/JWT secrets are no longer Bicep params (T-0134 — they are
          # pushed to Key Vault by the deploy workflow), so only the Postgres
          # admin pair is needed here; ALERT_EMAIL has an in-file default.
          POSTGRES_ADMIN_USER: ci-lint
          POSTGRES_ADMIN_PASSWORD: ci-lint
