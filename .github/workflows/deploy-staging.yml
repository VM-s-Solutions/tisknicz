# Deploys the non-production "dev" environment (Azure RG rg-makables-weu-dev,
# resources <type>-makables-weu-dev, GitHub environment "dev"). The file is named
# deploy-staging.yml for path stability; the env it targets is dev.
#
# SECRETS MODEL (T-0134): Bicep provisions the vault + derives the connection
# strings; this workflow pushes the EXTERNAL secrets (JWT key, SendGrid, Comgate,
# Packeta, Mapbox) from GitHub Environment secrets into Key Vault right after
# provisioning. The hosts read everything as Key Vault references via their
# managed identities — no secret rides as a plaintext App Setting anymore.
name: Deploy → dev

on:
  push:
    branches: [master]
    # Docs / process-only changes must NOT redeploy the whole stack (T-0153).
    # A test-plan markdown merge on 2026-07-17 (PR #97) re-ran Bicep, which
    # bounced the App Services, and the maker backend zipdeploy then landed
    # mid-restart and failed with the OneDeploy "SCM container restart" race.
    # paths-ignore only skips a push when EVERY changed file matches — a mixed
    # code+docs push still deploys, so no real code change is ever missed.
    # `.github/**` is deliberately NOT ignored: a workflow change should still
    # run to validate itself.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'agents/**'
      - '.claude/**'
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  RG: rg-makables-weu-dev
  KV: kv-makables-weu-dev
  PG_SERVER: pg-makables-weu-dev

jobs:
  bicep:
    name: Bicep infrastructure
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Identical to the production pre-flight, pointed at the dev params. Dev's
      # SKU is the Standard_LRS default, which is universally entitled — so this
      # run is a REHEARSAL of the mechanism on every dev deploy, rather than a
      # check whose first execution is the production deploy it protects.
      # Storage SKU entitlement is
      # SUBSCRIPTION-scoped, and this subscription is already offer-restricted
      # for Postgres Flexible Server in westeurope (see weu.prod.bicepparam), so
      # Standard_GZRS being available is not an assumption we get to make.
      # Without this a restriction surfaces inside the `blob` module after the
      # App Service Plan, App Insights, the VNet and a fresh Postgres server all
      # exist, on a first-ever deploy that cannot be cleanly torn down because
      # the Key Vault has already taken a 90-day name lock.
      #
      # The logic lives in scripts/ so it is unit-testable against stubbed API
      # responses, and so deploy-staging.yml runs the IDENTICAL code on every dev
      # deploy — otherwise this step's first ever execution would be the single
      # production run it exists to protect. It fails CLOSED on a definite
      # "restricted"/"not offered" and OPEN on an inability to ask (the deploy
      # principal is Contributor scoped to the resource group, while this query
      # needs subscription-scope read). ARM remains the real gate.
      - name: Pre-flight — the blob SKU is entitled in this subscription/region
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            bash scripts/preflight-storage-sku.sh \
              infra/bicep/envs/weu.dev.bicepparam \
              "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Deploy Bicep
        uses: azure/cli@v2
        env:
          # The .bicepparam reads these via readEnvironmentVariable(); a missing
          # secret aborts the deploy (fail-closed). No secret value is in the repo.
          # The provider/JWT secrets are NOT Bicep params anymore — they are pushed
          # to Key Vault by the step below.
          POSTGRES_ADMIN_USER: ${{ secrets.POSTGRES_ADMIN_USER }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          # Comgate non-secret switches. Unset => the param defaults to empty
          # and the setting is omitted, which for the allowlist means
          # fail-closed: every payment callback is rejected with 401. These
          # MUST be forwarded here or the .bicepparam readEnvironmentVariable()
          # silently resolves to '' on the runner and the secret does nothing.
          COMGATE_BASE_URL: ${{ secrets.COMGATE_BASE_URL }}
          COMGATE_WEBHOOK_ALLOWED_IPS: ${{ secrets.COMGATE_WEBHOOK_ALLOWED_IPS }}
        with:
          azcliversion: latest
          inlineScript: |
            az deployment group create \
              --resource-group $RG \
              --template-file infra/bicep/main.bicep \
              --parameters infra/bicep/envs/weu.dev.bicepparam

      # Push the EXTERNAL secrets (the ones Bicep cannot derive) into Key Vault.
      # Self-grants the CI principal Key Vault Secrets Officer on the vault (the
      # OIDC principal needs User Access Administrator on the RG for this), then
      # retries each write to ride out RBAC propagation on a fresh assignment.
      # Idempotent — `az role assignment create` is a no-op when it exists, and
      # re-setting a secret to the same value is harmless.
      - name: Push external secrets to Key Vault
        env:
          JWT_SIGNING_KEY_BASE64: ${{ secrets.JWT_SIGNING_KEY_BASE64 }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          COMGATE_MERCHANT_ID: ${{ secrets.COMGATE_MERCHANT_ID }}
          COMGATE_SECRET: ${{ secrets.COMGATE_SECRET }}
          PACKETA_API_KEY: ${{ secrets.PACKETA_API_KEY }}
          PACKETA_PUBLIC_WIDGET_KEY: ${{ secrets.PACKETA_PUBLIC_WIDGET_KEY }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          APPLE_SERVICES_ID: ${{ secrets.APPLE_SERVICES_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY_PEM: ${{ secrets.APPLE_PRIVATE_KEY_PEM }}
        run: |
          set -euo pipefail
          # Resolve the CI principal's object id (OIDC: account user.name is the app/client id).
          CI_OID="$(az ad signed-in-user show --query id -o tsv 2>/dev/null || true)"
          if [ -z "$CI_OID" ]; then
            CI_APPID="$(az account show --query user.name -o tsv)"
            CI_OID="$(az ad sp show --id "$CI_APPID" --query id -o tsv)"
          fi
          KV_ID="$(az keyvault show -n "$KV" -g "$RG" --query id -o tsv)"
          az role assignment create --assignee-object-id "$CI_OID" --assignee-principal-type ServicePrincipal \
            --role "Key Vault Secrets Officer" --scope "$KV_ID" --output none 2>/dev/null || true

          set_secret() {
            # $1 = Key Vault secret name, $2 = value; fail loudly if empty.
            # Retry to ride out RBAC propagation on a freshly-granted assignment.
            if [ -z "$2" ]; then
              echo "::error::GitHub secret for Key Vault secret '$1' is EMPTY — the hosts will crash on ValidateOnStart. Set it and re-run."
              return 1
            fi
            for attempt in 1 2 3 4 5 6; do
              if az keyvault secret set --vault-name "$KV" --name "$1" --value "$2" --output none 2>/dev/null; then
                echo "set $1"; return 0
              fi
              echo "  $1 not authorized yet (attempt $attempt) — waiting 20s for RBAC propagation…"
              sleep 20
            done
            echo "::error::failed to set $1 after retries (check the CI principal's Key Vault RBAC)"; return 1
          }

          ensure_secret() {
            # DEV-ONLY provider-secret semantics: $1 = KV name, $2 = GitHub
            # value, $3 = boot-stub. The ValidateOnStart validators only need a
            # NON-EMPTY value and no host calls a provider at startup, so dev
            # boots on stubs until the real credentials exist (mirrors the CI
            # spec-parity job + appsettings.Development.json). Precedence:
            #   GitHub secret set        -> push it (real value wins, always)
            #   unset + vault has value  -> keep the vault value (never stomp
            #                               a manually-set real credential)
            #   unset + vault empty      -> push the stub so the host boots
            # Provider calls (payments, shipping, geocoding, EMAILS) fail at
            # call time until real values land. Prod has NO stub path.
            if [ -n "$2" ]; then set_secret "$1" "$2"; return; fi
            existing_len=$(az keyvault secret show --vault-name "$KV" --name "$1" --query "length(value)" -o tsv 2>/dev/null || echo 0)
            if [ "${existing_len:-0}" -gt 0 ]; then
              echo "kept $1 (GitHub secret empty; vault already has a value)"
              return 0
            fi
            echo "stub $1 (GitHub secret empty — pushing dev boot-stub; set the real secret and redeploy to replace it)"
            set_secret "$1" "$3"
          }

          # Required-for-real in every environment: JWT signing key (tokens must
          # verify) — no stub fallback.
          set_secret "Jwt--SigningKeyBase64"         "$JWT_SIGNING_KEY_BASE64"
          # Provider credentials — stub fallback in dev (see ensure_secret).
          ensure_secret "SendGrid--ApiKey"           "$SENDGRID_API_KEY"           "SG.dev-boot-stub"
          ensure_secret "Resend--ApiKey"             "$RESEND_API_KEY"             "re_dev_boot_stub"
          ensure_secret "Comgate--MerchantId"        "$COMGATE_MERCHANT_ID"        "dev-boot-stub-merchant"
          ensure_secret "Comgate--Secret"            "$COMGATE_SECRET"             "dev-boot-stub-secret"
          ensure_secret "Packeta--ApiKey"            "$PACKETA_API_KEY"            "dev-boot-stub-packeta-api-key"
          ensure_secret "Packeta--PublicWidgetKey"   "$PACKETA_PUBLIC_WIDGET_KEY"  "dev-boot-stub-packeta-widget-key"
          ensure_secret "Mapbox--AccessToken"        "$MAPBOX_ACCESS_TOKEN"        "pk.dev-boot-stub"
          # OAuth sign-in providers (Auth:Google T-0026 / Auth:Apple ADR 0026).
          # Deliberately NOT ValidateOnStart in the hosts — the stub keeps the
          # KV reference resolvable and the sign-in button fails closed at the
          # provider until real credentials land. Registration steps:
          # docs/deployment/oauth-providers.md.
          ensure_secret "Auth--Google--ClientId"     "$GOOGLE_OAUTH_CLIENT_ID"     "dev-boot-stub.apps.googleusercontent.com"
          ensure_secret "Auth--Google--ClientSecret" "$GOOGLE_OAUTH_CLIENT_SECRET" "dev-boot-stub"
          ensure_secret "Auth--Apple--ClientId"      "$APPLE_SERVICES_ID"          "cz.makables.dev-boot-stub"
          ensure_secret "Auth--Apple--TeamId"        "$APPLE_TEAM_ID"              "DEVBOOTSTUB"
          ensure_secret "Auth--Apple--KeyId"         "$APPLE_KEY_ID"               "DEVBOOTSTUB"
          ensure_secret "Auth--Apple--PrivateKeyPem" "$APPLE_PRIVATE_KEY_PEM"      "dev-boot-stub-not-a-key"

      # Assert the full secret inventory (external + Bicep-derived) is present
      # and NON-EMPTY in the vault before anything deploys. An empty secret
      # resolves "successfully" into an empty app setting and the host dies on
      # ValidateOnStart with a 503 warmup loop — fail the deploy here instead.
      # Only lengths are printed, never values.
      - name: Verify Key Vault secret inventory
        run: |
          set -euo pipefail
          fail=0
          for name in "Jwt--SigningKeyBase64" "SendGrid--ApiKey" "Resend--ApiKey" "Comgate--MerchantId" \
                      "Comgate--Secret" "Packeta--ApiKey" "Packeta--PublicWidgetKey" \
                      "Mapbox--AccessToken" "ConnectionStrings--Postgres" \
                      "Storage--ConnectionString" "OutboxQueues--ConnectionString" \
                      "Auth--Google--ClientId" "Auth--Google--ClientSecret" \
                      "Auth--Apple--ClientId" "Auth--Apple--TeamId" \
                      "Auth--Apple--KeyId" "Auth--Apple--PrivateKeyPem"; do
            len=$(az keyvault secret show --vault-name "$KV" --name "$name" --query "length(value)" -o tsv 2>/dev/null || echo 0)
            if [ "${len:-0}" -gt 0 ]; then
              echo "OK      $name (length $len)"
            else
              echo "::error::Key Vault secret '$name' is MISSING or EMPTY in $KV — hosts will crash on ValidateOnStart."
              fail=1
            fi
          done
          exit $fail

  migrate:
    name: EF Core migrations → Postgres
    runs-on: ubuntu-latest
    environment: dev
    needs: [bicep]
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Cache the restored NuGet packages across jobs/runs. No packages.lock.json
      # exists, so key on the central package manifest (Directory.Packages.props
      # pins every version) + global.json + all csproj (package-ref add/remove).
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/src/Directory.Packages.props', 'backend/src/global.json', 'backend/src/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Generate an IDEMPOTENT SQL script from the EF Core migrations (safe to
      # re-run: each migration is guarded by a check against __EFMigrationsHistory).
      # The DbContext lives in Infra.Database; the Customer host is the startup
      # project that wires it. No DB connection needed to GENERATE the script.
      # `dotnet ef` loads the COMPILED startup assembly, so the project must be
      # restored + built first (NETSDK1004 = missing project.assets.json = no restore).
      - name: Restore + build the startup project
        run: |
          dotnet restore backend/src/Makables.Web.Customer/Makables.Web.Customer.csproj
          dotnet build backend/src/Makables.Web.Customer/Makables.Web.Customer.csproj \
            --configuration Release --no-restore
      - name: Generate idempotent migration script
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.*
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations script --idempotent \
            --project backend/src/Makables.Infra.Database/Makables.Infra.Database.csproj \
            --startup-project backend/src/Makables.Web.Customer/Makables.Web.Customer.csproj \
            --configuration Release --no-build \
            --output ${{ runner.temp }}/migrate.sql

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The GitHub runner has a public IP and is NOT an "Azure service", so the
      # dev allowAllAzureServices rule does not admit it. Open a temporary
      # firewall rule for the runner IP (az step), apply the SQL with psql ON
      # THE RUNNER (the azure-cli action's container is Alpine — no apt-get/psql),
      # then always remove the rule. (Operator note: in prod the migrate job runs
      # from inside the VNet via the private endpoint instead — see
      # docs/deployment/deploy-runbook.md.)
      - name: Open temp firewall rule for the runner IP
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            set -euo pipefail
            RUNNER_IP=$(curl -s https://api.ipify.org)
            az postgres flexible-server firewall-rule create \
              --resource-group $RG --server-name $PG_SERVER \
              --name ci-migrate-${{ github.run_id }} \
              --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP" \
              --output none

      - name: Apply migration via psql (on the runner)
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          PGUSER: ${{ secrets.POSTGRES_ADMIN_USER }}
        run: |
          set -euo pipefail
          # postgresql-client already ships in the GitHub runner image, so the
          # unconditional `apt-get update` bought nothing and cost everything:
          # on 2026-08-19 it went silent right after `noble-security InRelease`
          # and stayed there until the 20-minute job timeout killed it — twice
          # in a row. Every downstream job (backend, functions, seed, smoke) is
          # gated behind this one, so a hung package index took the whole
          # deploy down while the database was reachable the entire time.
          # Only reach for apt when psql genuinely is missing, and bound it so
          # a wedged mirror fails in minutes instead of eating the job.
          if ! command -v psql >/dev/null 2>&1; then
            sudo timeout 300 apt-get update
            sudo timeout 300 apt-get install -y postgresql-client
          fi
          psql --version
          FQDN="$PG_SERVER.postgres.database.azure.com"
          # connect_timeout: a blocked firewall rule should surface as a failed
          # step, not as a socket hanging until the job times out.
          psql "host=$FQDN port=5432 dbname=makables user=$PGUSER sslmode=require connect_timeout=30" \
            -v ON_ERROR_STOP=1 -f ${{ runner.temp }}/migrate.sql

      - name: Remove temp firewall rule
        if: always()
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az postgres flexible-server firewall-rule delete --yes \
              --resource-group $RG --server-name $PG_SERVER \
              --name ci-migrate-${{ github.run_id }} --output none || true

  # Dev-only mock data. The migrations seed REFERENCE data (country CZ,
  # CountryConfiguration, categories, email templates) but no marketplace
  # content, so a fresh dev DB rendered an empty catalog. Makables.Tools.Seeder
  # runs two passes: the demo snapshot (users, makers, products, orders in
  # every state, messages, reviews), short-circuited by its sentinel admin
  # row, and 50 catalog makers checked ONE BY ONE against the database.
  # Re-running on every deploy is therefore a no-op once both are in — and
  # a dev DB that already holds data (hand-made rows, an earlier and shorter
  # blueprint list) is topped up rather than duplicated.
  #
  # There is NO equivalent job in deploy-production.yml, and the seeder itself
  # hard-refuses any host/database containing "prod" with no override.
  seed:
    name: Dev mock data → Postgres
    runs-on: ubuntu-latest
    environment: dev
    needs: [migrate]
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Same runner-IP dance as the migrate job — the runner's public IP is
      # not covered by the allowAllAzureServices rule.
      - name: Open temp firewall rule for the runner IP
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            set -euo pipefail
            RUNNER_IP=$(curl -s https://api.ipify.org)
            az postgres flexible-server firewall-rule create \
              --resource-group $RG --server-name $PG_SERVER \
              --name ci-seed-${{ github.run_id }} \
              --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP" \
              --output none

      # --allow-remote is required for any non-localhost target (the seeder
      # refuses otherwise). Connection string shape mirrors the Bicep-derived
      # ConnectionStrings--Postgres secret.
      - name: Run the dev data seeder
        env:
          PGUSER: ${{ secrets.POSTGRES_ADMIN_USER }}
          PGPASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          export ConnectionStrings__Postgres="Host=$PG_SERVER.postgres.database.azure.com;Port=5432;Database=makables;Username=$PGUSER;Password=$PGPASSWORD;SslMode=Require"
          dotnet run --project backend/src/Makables.Tools.Seeder/Makables.Tools.Seeder.csproj \
            --configuration Release -- --allow-remote

      - name: Remove temp firewall rule
        if: always()
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az postgres flexible-server firewall-rule delete --yes \
              --resource-group $RG --server-name $PG_SERVER \
              --name ci-seed-${{ github.run_id }} --output none || true

  backend:
    name: Backend (.NET) → App Services
    runs-on: ubuntu-latest
    environment: dev
    needs: [migrate]
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    strategy:
      # A transient OneDeploy 409 on ONE host must never cancel the other
      # three: on 2026-08-20 (run 32350253265) the maker conflict cancelled
      # customer/admin/public mid-deploy, leaving the environment on a mixed
      # set of builds even though nothing was wrong with those three.
      fail-fast: false
      matrix:
        host:
          - { project: 'Makables.Web.Customer', app: 'app-makables-customer-weu-dev' }
          - { project: 'Makables.Web.Maker',    app: 'app-makables-maker-weu-dev'    }
          - { project: 'Makables.Web.Admin',    app: 'app-makables-admin-weu-dev'    }
          - { project: 'Makables.Web.Public',   app: 'app-makables-public-weu-dev'   }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Cache the restored NuGet packages across jobs/runs. No packages.lock.json
      # exists, so key on the central package manifest (Directory.Packages.props
      # pins every version) + global.json + all csproj (package-ref add/remove).
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/src/Directory.Packages.props', 'backend/src/global.json', 'backend/src/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Publish
        run: |
          dotnet publish backend/src/${{ matrix.host.project }}/${{ matrix.host.project }}.csproj \
            --configuration Release \
            --output ${{ runner.temp }}/publish

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # OneDeploy answers 409 Conflict when the target site already has a
      # deployment in flight or is mid-restart — the four API hosts and the
      # frontend share ONE App Service Plan worker, and the bicep job bounces
      # all of them minutes earlier. On 2026-08-20 the maker host lost that
      # race in two consecutive dev runs (32350253265, 32350273747) while its
      # three siblings deployed fine, and re-running the identical job an hour
      # later deployed the same package with no change: the conflict is
      # transient. Settle, then retry once, before failing the environment.
      - name: Deploy to App Service
        id: deploy
        continue-on-error: true
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ matrix.host.app }}
          package: ${{ runner.temp }}/publish

      - name: Wait for the site to settle
        if: steps.deploy.outcome == 'failure'
        run: |
          set -euo pipefail
          APP='${{ matrix.host.app }}'
          echo "::warning::deploy of $APP failed (OneDeploy conflict?) — settling before one retry"
          for i in $(seq 1 10); do
            state=$(az webapp show -g "$RG" -n "$APP" --query state -o tsv 2>/dev/null || echo Unknown)
            echo "  check $i: site state=$state"
            [ "$state" = "Running" ] && break
            sleep 30
          done
          # Give an in-flight OneDeploy / container swap time to release the site.
          sleep 120

      - name: Deploy to App Service (retry)
        if: steps.deploy.outcome == 'failure'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ matrix.host.app }}
          package: ${{ runner.temp }}/publish

  functions:
    name: Functions (.NET isolated) → Functions App
    runs-on: ubuntu-latest
    environment: dev
    needs: [migrate]
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Cache the restored NuGet packages across jobs/runs. No packages.lock.json
      # exists, so key on the central package manifest (Directory.Packages.props
      # pins every version) + global.json + all csproj (package-ref add/remove).
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/src/Directory.Packages.props', 'backend/src/global.json', 'backend/src/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Publish Functions
        run: |
          dotnet publish backend/src/Makables.Functions/Makables.Functions.csproj \
            --configuration Release \
            --output ${{ runner.temp }}/functions-publish
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@v1
        with:
          app-name: func-makables-weu-dev
          package: ${{ runner.temp }}/functions-publish

  frontend:
    name: Frontend (Next.js) → App Service
    runs-on: ubuntu-latest
    environment: dev
    needs: [bicep]
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build (standalone)
        working-directory: frontend
        env:
          # NEXT_PUBLIC_* is inlined into the CLIENT bundle at build time — the
          # runtime App Settings on the web app only cover SSR fetches.
          #
          # T-0153 same-origin proxy: the browser-facing bases are RELATIVE
          # `/api-proxy/<host>` paths — the browser only ever talks to the
          # frontend origin, so the ADR 0012 SameSite=Strict session cookies
          # land first-party (sibling *.azurewebsites.net hosts share no
          # cookie-visible parent — public-suffix domain). next.config.ts
          # rewrites each prefix to the matching API_<HOST>_INTERNAL_BASE_URL,
          # which is ALSO read at build time to bake the rewrite table and at
          # runtime (App Settings, web-app.bicep) for SSR fetches.
          NEXT_PUBLIC_SITE_URL: https://dev.makables.cz
          NEXT_PUBLIC_API_CUSTOMER_BASE_URL: /api-proxy/customer
          NEXT_PUBLIC_API_MAKER_BASE_URL: /api-proxy/maker
          NEXT_PUBLIC_API_ADMIN_BASE_URL: /api-proxy/admin
          NEXT_PUBLIC_API_PUBLIC_BASE_URL: /api-proxy/public
          API_CUSTOMER_INTERNAL_BASE_URL: https://app-makables-customer-weu-dev.azurewebsites.net
          API_MAKER_INTERNAL_BASE_URL: https://app-makables-maker-weu-dev.azurewebsites.net
          API_ADMIN_INTERNAL_BASE_URL: https://app-makables-admin-weu-dev.azurewebsites.net
          API_PUBLIC_INTERNAL_BASE_URL: https://app-makables-public-weu-dev.azurewebsites.net
        run: |
          npm ci
          npx next build

      # Assemble the standalone deploy package: the standalone server +
      # the static assets and public/ that Next does NOT copy into it.
      - name: Assemble standalone package
        working-directory: frontend
        run: |
          set -euo pipefail
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi
          # Multi-worker entry point (web-app.bicep runs `node cluster.js`).
          # It is NOT part of the traced standalone output, so a missing copy
          # here is a site that never binds its port — fail loudly instead.
          test -f deploy/cluster.js
          cp deploy/cluster.js .next/standalone/cluster.js

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Same transient OneDeploy 409 the backend matrix guards against (see
      # the comment there) — one settle + one retry before failing.
      - name: Deploy to App Service
        id: deploy
        continue-on-error: true
        uses: azure/webapps-deploy@v3
        with:
          app-name: web-makables-weu-dev
          package: frontend/.next/standalone

      - name: Wait for the site to settle
        if: steps.deploy.outcome == 'failure'
        run: |
          set -euo pipefail
          APP='web-makables-weu-dev'
          echo "::warning::deploy of $APP failed (OneDeploy conflict?) — settling before one retry"
          for i in $(seq 1 10); do
            state=$(az webapp show -g "$RG" -n "$APP" --query state -o tsv 2>/dev/null || echo Unknown)
            echo "  check $i: site state=$state"
            [ "$state" = "Running" ] && break
            sleep 30
          done
          # Give an in-flight OneDeploy / container swap time to release the site.
          sleep 120

      - name: Deploy to App Service (retry)
        if: steps.deploy.outcome == 'failure'
        uses: azure/webapps-deploy@v3
        with:
          app-name: web-makables-weu-dev
          package: frontend/.next/standalone

  # Post-deploy smoke: a host that "deployed green" but dies on ValidateOnStart
  # (missing/empty secret, unresolved Key Vault reference) never binds its port
  # and 503s the warmup probe forever — this job turns that into a RED run.
  # /health is the dependency-free liveness endpoint each API host maps.
  smoke:
    name: Post-deploy smoke (hosts + a DB-backed read + the Functions host)
    runs-on: ubuntu-latest
    needs: [backend, functions, frontend]
    permissions:
      id-token: write
      contents: read
    # Budget is the SUM of the per-step deadlines below (8 + 5 + 5 + 12 = 30 min)
    # plus headroom for checkout, login and one in-flight request per step. The
    # steps use wall-clock deadlines rather than attempt counts, so these numbers
    # are the real worst case. The previous attempt-count loops added up to ~41
    # minutes inside a 15-minute budget, which meant a genuinely slow deploy was
    # cancelled by GitHub instead of reporting the error the gate is written for.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      # All four share one App Service Plan and restart together, so they warm up
      # together: one 8-minute deadline for the set, not 8 minutes each.
      - name: Probe /health on every API host
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 480 ))
          for h in app-makables-customer-weu-dev app-makables-maker-weu-dev app-makables-admin-weu-dev app-makables-public-weu-dev; do
            left=$(( deadline - $(date +%s) ))
            [ "$left" -lt 30 ] && left=30
            bash scripts/smoke-probe.sh "https://$h.azurewebsites.net/health" "$left" "" "$h /health"
          done

      # /health is deliberately dependency-free (see each Program.cs), so a host
      # whose database is unreachable still answers 200. That is right for a
      # liveness probe and wrong for a deploy gate. GET /api/v1/catalog/makers is
      # anonymous and reads through EF Core, so it exercises connection-string
      # resolution, the Key Vault reference, network reachability and the schema
      # in one call. The assertion is on SHAPE — "totalCount" is a PagedData<T>
      # envelope field a host without a database cannot produce — so a fresh
      # environment with an empty catalog still passes.
      - name: Probe a DB-backed endpoint (the gate /health cannot be)
        run: |
          set -euo pipefail
          bash scripts/smoke-probe.sh \
            "https://app-makables-public-weu-dev.azurewebsites.net/api/v1/catalog/makers?country=CZ" \
            300 '"totalCount"' "public host, DB-backed catalog read"

      - name: Probe the frontend
        run: |
          set -euo pipefail
          bash scripts/smoke-probe.sh "https://web-makables-weu-dev.azurewebsites.net/" 300 "" "frontend"

      # Before this step the Functions host had NO externally observable surface
      # — every other trigger is a timer or a queue trigger — so a host that
      # never started deployed GREEN. That failure is silent: the worker exits
      # before indexing a function, ProcessOutboxTimer never fires, the outbox
      # never drains and no transactional email is ever sent.
      #
      # 12 minutes because AzureWebJobsStorage is identity-based: the host 403s
      # on host storage until its managed-identity role assignments propagate,
      # which Azure documents as taking up to ~10 minutes. That window used to be
      # an invisible race the deploy won by luck.
      - name: Probe /api/health on the Functions host
        run: |
          set -euo pipefail
          bash scripts/smoke-probe.sh \
            "https://func-makables-weu-dev.azurewebsites.net/api/health" 720 '"status"' "func-makables-weu-dev /api/health"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The probe above proves the site is up, the worker is running and every
      # ValidateOnStart check passed — but NOT that the other functions indexed
      # cleanly. Container validation only runs when IsDevelopment(), and the
      # deployed host runs as Production, so an unresolvable handler dependency
      # surfaces at first invocation. And a trigger whose %Setting% binding does
      # not resolve is reported "in error" while the host keeps serving
      # /api/health — the outbox-never-drains failure, with a green probe.
      - name: Assert the Functions host is Running with no functions in error
        run: |
          set -euo pipefail
          bash scripts/assert-functions-host-healthy.sh rg-makables-weu-dev func-makables-weu-dev
