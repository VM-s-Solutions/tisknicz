# Deploys the non-production "dev" environment (Azure RG rg-makables-dev,
# resources makables-dev-*, GitHub environment "dev"). The file is named
# deploy-staging.yml for path stability; the env it targets is dev.
name: Deploy → dev

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  bicep:
    name: Bicep infrastructure
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep
        uses: azure/cli@v2
        env:
          # The .bicepparam reads these via readEnvironmentVariable(); a missing
          # secret aborts the deploy (fail-closed). No secret value is in the repo.
          POSTGRES_ADMIN_USER: ${{ secrets.POSTGRES_ADMIN_USER }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          JWT_SIGNING_KEY_BASE64: ${{ secrets.JWT_SIGNING_KEY_BASE64 }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          COMGATE_MERCHANT_ID: ${{ secrets.COMGATE_MERCHANT_ID }}
          COMGATE_SECRET: ${{ secrets.COMGATE_SECRET }}
          PACKETA_API_KEY: ${{ secrets.PACKETA_API_KEY }}
          PACKETA_PUBLIC_WIDGET_KEY: ${{ secrets.PACKETA_PUBLIC_WIDGET_KEY }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        with:
          azcliversion: latest
          inlineScript: |
            az deployment group create \
              --resource-group rg-makables-dev \
              --template-file infra/bicep/main.bicep \
              --parameters infra/bicep/envs/staging.bicepparam

  migrate:
    name: EF Core migrations → Postgres
    runs-on: ubuntu-latest
    environment: dev
    needs: [bicep]
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Generate an IDEMPOTENT SQL script from the EF Core migrations (safe to
      # re-run: each migration is guarded by a check against __EFMigrationsHistory).
      # The DbContext lives in Infra.Database; the Customer host is the startup
      # project that wires it. No DB connection needed to GENERATE the script.
      # `dotnet ef` loads the COMPILED startup assembly, so the project must be
      # restored + built first (NETSDK1004 = missing project.assets.json = no restore).
      - name: Restore + build the startup project
        run: |
          dotnet restore backend/src/Makables.Web.Customer/Makables.Web.Customer.csproj
          dotnet build backend/src/Makables.Web.Customer/Makables.Web.Customer.csproj \
            --configuration Release --no-restore
      - name: Generate idempotent migration script
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.*
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations script --idempotent \
            --project backend/src/Makables.Infra.Database/Makables.Infra.Database.csproj \
            --startup-project backend/src/Makables.Web.Customer/Makables.Web.Customer.csproj \
            --configuration Release --no-build \
            --output ${{ runner.temp }}/migrate.sql

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The GitHub runner has a public IP and is NOT an "Azure service", so the
      # dev allowAllAzureServices rule does not admit it. Open a temporary
      # firewall rule for the runner IP, apply, then remove it (operator note:
      # in prod the migrate job runs from inside the VNet via the private
      # endpoint instead — see docs/deployment/deploy-runbook.md).
      - name: Apply migration via psql (temp firewall rule)
        uses: azure/cli@v2
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          PGUSER: ${{ secrets.POSTGRES_ADMIN_USER }}
        with:
          azcliversion: latest
          inlineScript: |
            set -euo pipefail
            RUNNER_IP=$(curl -s https://api.ipify.org)
            az postgres flexible-server firewall-rule create \
              --resource-group rg-makables-dev --server-name makables-dev-db \
              --name ci-migrate-${{ github.run_id }} \
              --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP" \
              --output none
            trap 'az postgres flexible-server firewall-rule delete --yes \
              --resource-group rg-makables-dev --server-name makables-dev-db \
              --name ci-migrate-${{ github.run_id }} --output none || true' EXIT
            apt-get update && apt-get install -y postgresql-client
            FQDN="makables-dev-db.postgres.database.azure.com"
            psql "host=$FQDN port=5432 dbname=makables user=$PGUSER sslmode=require" \
              -v ON_ERROR_STOP=1 -f ${{ runner.temp }}/migrate.sql

  backend:
    name: Backend (.NET) → App Services
    runs-on: ubuntu-latest
    environment: dev
    needs: [migrate]
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        host:
          - { project: 'Makables.Web.Customer', app: 'makables-dev-customer' }
          - { project: 'Makables.Web.Maker',    app: 'makables-dev-maker'    }
          - { project: 'Makables.Web.Admin',    app: 'makables-dev-admin'    }
          - { project: 'Makables.Web.Public',   app: 'makables-dev-public'   }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: |
          dotnet publish backend/src/${{ matrix.host.project }}/${{ matrix.host.project }}.csproj \
            --configuration Release \
            --output ${{ runner.temp }}/publish

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ matrix.host.app }}
          package: ${{ runner.temp }}/publish

  functions:
    name: Functions (.NET isolated) → Functions App
    runs-on: ubuntu-latest
    environment: dev
    needs: [migrate]
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish Functions
        run: |
          dotnet publish backend/src/Makables.Functions/Makables.Functions.csproj \
            --configuration Release \
            --output ${{ runner.temp }}/functions-publish
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@v1
        with:
          app-name: makables-dev-functions
          package: ${{ runner.temp }}/functions-publish

  frontend:
    name: Frontend (Next.js) → Vercel
    runs-on: ubuntu-latest
    environment: dev
    needs: [bicep]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx next build
      - name: Deploy to Vercel (preview)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm i -g vercel
          vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
          vercel build --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --token=$VERCEL_TOKEN
