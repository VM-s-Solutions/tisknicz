name: Deploy → production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PRODUCTION to confirm. Anything else aborts.'
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  guard:
    name: Confirmation guard
    runs-on: ubuntu-latest
    steps:
      - name: Verify input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "PRODUCTION" ]; then
            echo "::error::confirm input must equal PRODUCTION (got '${{ github.event.inputs.confirm }}')."
            exit 1
          fi

  bicep:
    name: Bicep infrastructure
    runs-on: ubuntu-latest
    environment: production
    needs: [guard]
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Bicep
        uses: azure/cli@v2
        env:
          # The .bicepparam reads these via readEnvironmentVariable(); a missing
          # secret aborts the deploy (fail-closed). No secret value is in the repo.
          POSTGRES_ADMIN_USER: ${{ secrets.POSTGRES_ADMIN_USER }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          JWT_SIGNING_KEY_BASE64: ${{ secrets.JWT_SIGNING_KEY_BASE64 }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          COMGATE_MERCHANT_ID: ${{ secrets.COMGATE_MERCHANT_ID }}
          COMGATE_SECRET: ${{ secrets.COMGATE_SECRET }}
          PACKETA_API_KEY: ${{ secrets.PACKETA_API_KEY }}
          PACKETA_PUBLIC_WIDGET_KEY: ${{ secrets.PACKETA_PUBLIC_WIDGET_KEY }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        with:
          azcliversion: latest
          inlineScript: |
            az deployment group create \
              --resource-group makables-prod \
              --template-file infra/bicep/main.bicep \
              --parameters infra/bicep/envs/production.bicepparam

  migrate:
    name: EF Core migrations → Postgres
    runs-on: ubuntu-latest
    environment: production
    needs: [bicep]
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # `dotnet ef` loads the COMPILED startup assembly, so restore + build the
      # startup project first (NETSDK1004 = missing project.assets.json = no restore).
      - name: Restore + build the startup project
        run: |
          dotnet restore backend/src/Makables.Web.Customer/Makables.Web.Customer.csproj
          dotnet build backend/src/Makables.Web.Customer/Makables.Web.Customer.csproj \
            --configuration Release --no-restore
      - name: Generate idempotent migration script
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.*
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations script --idempotent \
            --project backend/src/Makables.Infra.Database/Makables.Infra.Database.csproj \
            --startup-project backend/src/Makables.Web.Customer/Makables.Web.Customer.csproj \
            --configuration Release --no-build \
            --output ${{ runner.temp }}/migrate.sql
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # PROD CONNECTIVITY: production Postgres has NO public firewall opening
      # (it sits behind a Private Endpoint per the launch-checklist). A public
      # GitHub runner cannot reach it directly. The operator either (a) runs this
      # job on a self-hosted runner inside the VNet, or (b) temporarily allows the
      # runner IP as a break-glass step. Documented in docs/deployment/deploy-runbook.md.
      # The temp-firewall approach below mirrors staging and works ONLY if a
      # public path is intentionally opened for the migration window.
      - name: Open temp firewall rule for the runner IP
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            set -euo pipefail
            RUNNER_IP=$(curl -s https://api.ipify.org)
            az postgres flexible-server firewall-rule create \
              --resource-group makables-prod --server-name makables-prod-pg \
              --name ci-migrate-${{ github.run_id }} \
              --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP" \
              --output none

      - name: Apply migration via psql (on the runner)
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          PGUSER: ${{ secrets.POSTGRES_ADMIN_USER }}
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y postgresql-client
          FQDN="makables-prod-pg.postgres.database.azure.com"
          psql "host=$FQDN port=5432 dbname=makables user=$PGUSER sslmode=require" \
            -v ON_ERROR_STOP=1 -f ${{ runner.temp }}/migrate.sql

      - name: Remove temp firewall rule
        if: always()
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az postgres flexible-server firewall-rule delete --yes \
              --resource-group makables-prod --server-name makables-prod-pg \
              --name ci-migrate-${{ github.run_id }} --output none || true

  functions:
    name: Functions (.NET isolated) → Functions App
    runs-on: ubuntu-latest
    environment: production
    needs: [migrate]
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish Functions
        run: |
          dotnet publish backend/src/Makables.Functions/Makables.Functions.csproj \
            --configuration Release \
            --output ${{ runner.temp }}/functions-publish
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@v1
        with:
          app-name: makables-prod-functions
          package: ${{ runner.temp }}/functions-publish

  backend:
    name: Backend (.NET) → App Services
    runs-on: ubuntu-latest
    environment: production
    needs: [migrate]
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        host:
          - { project: 'Makables.Web.Customer', app: 'makables-prod-customer' }
          - { project: 'Makables.Web.Maker',    app: 'makables-prod-maker'    }
          - { project: 'Makables.Web.Admin',    app: 'makables-prod-admin'    }
          - { project: 'Makables.Web.Public',   app: 'makables-prod-public'   }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: |
          dotnet publish backend/src/${{ matrix.host.project }}/${{ matrix.host.project }}.csproj \
            --configuration Release \
            --output ${{ runner.temp }}/publish
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ matrix.host.app }}
          package: ${{ runner.temp }}/publish

  frontend:
    name: Frontend (Next.js) → App Service
    runs-on: ubuntu-latest
    environment: production
    needs: [bicep]
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build (standalone)
        working-directory: frontend
        run: |
          npm ci
          npx next build

      - name: Assemble standalone package
        working-directory: frontend
        run: |
          set -euo pipefail
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: makables-prod-web
          package: frontend/.next/standalone
